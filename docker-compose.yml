services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitpulse
      POSTGRES_PASSWORD: gitpulse
      POSTGRES_DB: gitpulse
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpulse -d gitpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgres://gitpulse:gitpulse@db:5432/gitpulse
        DIRECT_URL: postgres://gitpulse:gitpulse@db:5432/gitpulse
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgres://gitpulse:gitpulse@db:5432/gitpulse
      DIRECT_URL: postgres://gitpulse:gitpulse@db:5432/gitpulse
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL_INTERNAL: http://app:3000
      AUTH_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && npm run start"

volumes:
  db_data:
